<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>納品データ作成ツール</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    input[type="text"] {
      width: 95%;
      padding: 4px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 10px;
    }
    .error {
      border: 2px solid red;
      background-color: #ffecec;
    }
    .info {
      margin-bottom: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>納品データ作成ツール</h1>

  <div class="info">🛈 「📊 冊数計算＋No.重複確認」ボタンを押すと、自動で冊数が入力されます</div>

  <table id="inputTable">
    <thead>
      <tr>
        <th>No.</th>
        <th>冊数</th>
        <th>納品先</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input type="text" class="no-input"></td>
        <td class="count-cell">-</td>
        <td><input type="text" class="destination-input"></td>
      </tr>
    </tbody>
  </table>

 <div style="margin-bottom: 10px;">
  <button onclick="addRow()">＋ 行を追加</button>
  <button onclick="checkData()">📊 冊数計算＋No.重複確認</button>
</div>

<div>
  <button onclick="exportExcel()">🧾 エクセルで出力</button>
  <button onclick="launchMail()">📧 メール起動（添付は手動でお願いします）</button>
</div>


  <script>
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        addRow();
      }
    });

    function addRow() {
      const table = document.getElementById('inputTable').getElementsByTagName('tbody')[0];
      const newRow = table.insertRow();
      const cell1 = newRow.insertCell();
      const cell2 = newRow.insertCell();
      const cell3 = newRow.insertCell();
      cell1.innerHTML = '<input type="text" class="no-input">';
      cell2.className = 'count-cell';
      cell2.textContent = '-';
      cell3.innerHTML = '<input type="text" class="destination-input">';
    }

    function parseRange(str) {
      let result = [];
      str = str.replace(/[　]/g, ' ')  // 全角スペース
               .replace(/[、]/g, ',')  // 全角カンマ
               .replace(/[~ー～?]/g, '-')
               .replace(/\s+/g, ',')
               .replace(/,,+/g, ',');
      const parts = str.split(',');

      for (const part of parts) {
        if (part.includes('-')) {
          const [start, end] = part.split('-').map(Number);
          if (!isNaN(start) && !isNaN(end) && start <= end) {
            for (let i = start; i <= end; i++) result.push(i);
          } else {
            return null; // パースエラー
          }
        } else if (!isNaN(part)) {
          result.push(Number(part));
        } else {
          return null; // パースエラー
        }
      }
      return result;
    }

    function checkData() {
      const rows = document.querySelectorAll('#inputTable tbody tr');
      const allNumbers = new Map();
      const numberMap = new Map();
      let errorMessages = [];

      rows.forEach((row, index) => {
        const noInput = row.querySelector('.no-input');
        const countCell = row.querySelector('.count-cell');
        const raw = noInput.value.trim();
        const parsed = parseRange(raw);

        noInput.classList.remove('error');
        if (!raw) {
          countCell.textContent = '-';
          return;
        }
        if (parsed === null) {
          errorMessages.push(`${index + 2}行目の No.欄の形式に誤りがあります。`);
          noInput.classList.add('error');
          countCell.textContent = '-';
        } else {
          countCell.textContent = parsed.length + '冊';
          parsed.forEach(num => {
            if (!numberMap.has(num)) {
              numberMap.set(num, []);
            }
            numberMap.get(num).push(index + 2);
          });
        }
      });

      // 重複チェック
      const duplicateMessages = [];
      for (const [num, rows] of numberMap.entries()) {
        if (rows.length > 1) {
          duplicateMessages.push(`・${num} が ${rows.join('行目と ')}行目 に重複しています`);
          rows.forEach(rowNum => {
            const input = document.querySelector(`#inputTable tbody tr:nth-child(${rowNum - 1}) .no-input`);
            if (input) input.classList.add('error');
          });
        }
      }

      if (errorMessages.length > 0 || duplicateMessages.length > 0) {
        alert((errorMessages.concat(duplicateMessages)).join('\n') +
          '\n\n・半角数字のみを使用してください\n・使用可能な記号は「-」「~」「ー」「～」「,」です（例：1-4,6,8）\n・区切りは「,」またはスペースで入力してください\n・アルファベットは使えません');
      } else {
        alert('チェック完了！すべて正常です。');
      }
    }

    function exportExcel() {
      alert('[ダミー] エクセル出力処理をここに実装');
    }

    function launchMail() {
      const subject = encodeURIComponent('納品データのご送付');
      const body = encodeURIComponent(
        'お疲れ様です。\n\n以下、納品データになります。\n\n※添付忘れにご注意ください※\n出力されたExcelファイル（納品データ_YYYYMMDD.xlsx）を添付のうえ、ご確認をお願いいたします。\n\nよろしくお願いいたします。'
      );
      const mailtoLink = `mailto:xxxx@example.com?subject=${subject}&body=${body}`;
      window.location.href = mailtoLink;
    }
  </script>
</body>
</html>
